name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * 1' # Mondays, 07:00 UTC (the emulator job is slow)
  workflow_dispatch:

permissions:
  contents: write # publish the reports to the gh-pages branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: '8.11.1'

jobs:
  unit:
    name: unit tests and lint (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Unit tests, lint, build the APKs
        run: |
          mkdir -p out/diag
          gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest 2>&1 | tee out/diag/unit.log
          exit "${PIPESTATUS[0]}"
      - name: Keep reports
        if: always()
        run: |
          mkdir -p out/unit out/lint
          cp -r app/build/reports/tests/testDebugUnitTest/. out/unit/ 2>/dev/null || true
          cp app/build/reports/lint-results-debug.html out/lint/index.html 2>/dev/null || true
          mkdir -p out/junit && cp app/build/test-results/testDebugUnitTest/*.xml out/junit/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit
          path: out

  mutants:
    name: mutation check (JVM)
    if: github.event_name != 'pull_request'
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Every planted bug must fail the unit tests
        run: |
          mkdir -p out/mutants
          python3 scripts/mutants.py | tee out/mutants/result.md | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants
          path: out

  device:
    name: Espresso and Appium on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the APKs
        run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Install Appium and the UiAutomator2 driver
        run: |
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0
          pip install -r appium/requirements.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator (API 30) → Espresso, then Appium
        id: device
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/device-tests.sh
      - name: Keep reports
        if: always()
        run: |
          mkdir -p out/espresso out/appium
          cp -r app/build/reports/androidTests/connected/debug/. out/espresso/ 2>/dev/null || cp -r app/build/reports/androidTests/connected/. out/espresso/ 2>/dev/null || true
          cp -r appium-results/. out/appium/ 2>/dev/null || true
          mkdir -p out/junit && find app/build/outputs/androidTest-results -name '*.xml' -exec cp {} out/junit/ \; 2>/dev/null || true
          cp appium-results/junit.xml out/junit/appium.xml 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device
          path: out
      - name: Fail the job if device tests failed
        if: steps.device.outcome == 'failure'
        run: exit 1

  publish:
    if: always() && github.ref == 'refs/heads/main'
    needs: [unit, device, mutants]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build the site
        run: |
          mkdir -p allure-results site/diag
          find parts -path '*/junit/*.xml' -exec cp {} allure-results/ \;
          git fetch origin gh-pages --depth=1 && git worktree add old origin/gh-pages || true
          if [ -d old/history ]; then cp -r old/history allure-results/; fi
          npx --yes allure-commandline@2.46.1 generate allure-results -o site --clean || true
          for p in unit device; do
            if [ -d parts/$p ]; then cp -r parts/$p/diag/. site/diag/ 2>/dev/null || true; fi
          done
          cp -r parts/unit/unit site/unit 2>/dev/null || true
          cp -r parts/unit/lint site/lint 2>/dev/null || true
          cp -r parts/device/espresso site/espresso 2>/dev/null || true
          cp -r parts/device/appium site/appium 2>/dev/null || true
          cp -r parts/mutants/mutants site/mutants 2>/dev/null || true
          for f in docs/*.html; do if [ -f "$f" ]; then cp "$f" site/; fi; done
          touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: site
